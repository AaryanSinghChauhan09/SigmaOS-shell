[package]
name = "sigmaos-shell"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "SigmaOS SigmaOS-shell component - Inspired by Arch Linux and Debian"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-shell"
readme = "README.md"
keywords = ["shell", "cli", "command"]
categories = ["command-line-utilities"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }

[profile.release]
opt-level = 3
